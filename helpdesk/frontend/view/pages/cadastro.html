<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Criar conta - Help Desk IFCE</title>
    <link href="../../src/css/style.css" rel="stylesheet">
    <script src="../../src/js/ui.js" defer></script>
    <script src="../../src/js/auth.js" defer></script>
</head>
<body class="pagina-login">

<!-- pular conteúdo -->
<a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>

<!-- conteúdo -->
<main id="conteudo" class="container">
<div tabindex="-1" data-auth-message class="aviso" role="status" aria-live="polite" hidden></div>

<div class="cartao-login">

    <h1 class="titulo-login">Criar conta</h1>
    <p class="subtitulo-login">Help Desk IFCE</p>

    <!-- cadastro -->
    <form action="/api/auth/register" method="POST" data-auth="register">

        <!-- nome -->
        <div class="campo">
            <label for="nome">Nome</label>
            <input type="text" class="entrada" id="nome" name="nome" maxlength="100" autocomplete="name" required>
        </div>

        <!-- e-mail -->
        <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" class="entrada" id="email" name="email" maxlength="150" autocomplete="email" required>
        </div>

        <!-- senha -->
        <div class="campo">
            <label for="senha">Senha</label>
            <input type="password" class="entrada" id="senha" name="senha" minlength="8" maxlength="128" autocomplete="new-password" required>
            <div class="dica">Mínimo de 8 caracteres.</div>
        </div>

        <!-- confirmação de senha -->
        <div class="campo">
            <label for="confirmar_senha">Confirmação de senha</label>
            <input type="password" class="entrada" id="confirmar_senha" name="confirmar_senha" minlength="8" maxlength="128" autocomplete="new-password" required>
        </div>

        <button type="submit" class="botao botao-verde botao-largo">Criar conta</button>
    </form>

    <!-- link de voltar -->
    <p class="rodape-cartao">
        Já tem conta? <a href="index.html">Voltar para o login</a>
    </p>
</div>

</main>

<!-- rodapé -->
<footer class="rodape">
    Help Desk IFCE &middot; Campus Boa Viagem &middot; Projeto escolar
</footer>

</body>
</html>
